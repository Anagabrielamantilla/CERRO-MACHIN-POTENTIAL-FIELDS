[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mantle3d"
version = "0.1.0"
description = "Independent gravity and magnetic inversions for Cerro Machin"
requires-python = ">=3.11"
dependencies = [
  "jupyterlab",
  "matplotlib",
  "numpy",
  "pandas",
  "pyproj",
  "pyyaml",
  "scipy",
]

[project.optional-dependencies]
geophysics = [
  "choclo>=0.3,<0.4",
  "discretize>=0.12,<0.13",
  "pymatsolver",
  "simpeg>=0.25,<0.26",
]
montecarlo = ["pyvista"]
dev = ["nbformat", "pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
